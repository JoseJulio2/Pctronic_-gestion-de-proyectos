<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facturación · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="facturacion" data-title="Facturación" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-4">
    <p class="text-sm text-gray-500">
      Vista global de todas las facturas de todos los proyectos. Para registrar una factura nueva, entra al proyecto correspondiente → pestaña "Facturación".
    </p>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <p class="text-xs font-medium text-gray-500">Total Facturado</p>
        <p class="text-lg font-bold" id="kpi-total">$ 0</p>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <p class="text-xs font-medium text-gray-500">Total Pagado</p>
        <p class="text-lg font-bold text-green-600" id="kpi-pagado">$ 0</p>
      </div>
      <div class="rounded-xl border border-amber-200 bg-amber-50 p-4">
        <p class="text-xs font-medium text-amber-700">Pendiente por Cobrar</p>
        <p class="text-lg font-bold text-amber-700" id="kpi-pendiente">$ 0</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <input id="filtro-busqueda" type="search" placeholder="Buscar por proyecto o N° factura..."
        class="w-72 rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary" />
      <select id="filtro-estado" class="rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary">
        <option value="">Estado: Todos</option>
        <option value="pendiente">Pendiente</option>
        <option value="pagada">Pagada</option>
        <option value="vencida">Vencida</option>
        <option value="anulada">Anulada</option>
      </select>
      <select id="filtro-empresa" class="rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary">
        <option value="">Empresa: Todas</option>
      </select>
    </div>

    <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3">Empresa</th>
            <th class="px-4 py-3">Proyecto</th>
            <th class="px-4 py-3">N° Factura</th>
            <th class="px-4 py-3">Emisión</th>
            <th class="px-4 py-3">Vencimiento</th>
            <th class="px-4 py-3">Valor</th>
            <th class="px-4 py-3">Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-facturas">
          <tr><td class="px-4 py-6 text-gray-400" colspan="6">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/facturacion.js"></script>
</body>
</html>
