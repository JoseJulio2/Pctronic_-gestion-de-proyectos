<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="login" class="font-display min-h-screen bg-gray-50 text-gray-900 antialiased">

<div class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <svg viewBox="0 0 24 24" class="h-12 w-12 text-primary" fill="currentColor" aria-hidden="true">
        <path d="M12 2 4 5v6c0 5.25 3.4 10.14 8 11.32C16.6 21.14 20 16.25 20 11V5l-8-3Zm0 2.18 6 2.25V11c0 4.28-2.7 8.24-6 9.28C8.7 19.24 6 15.28 6 11V6.43l6-2.25Z"/>
        <path d="m11 13.59-2.3-2.3-1.4 1.42L11 16.4l6.7-6.7-1.4-1.41L11 13.59Z"/>
      </svg>
      <h1 class="mt-3 text-xl font-bold text-gray-900">Pctronic Seguridad Electrónica</h1>
      <p class="text-sm text-gray-500">Sistema de gestión de proyectos</p>
    </div>

    <form id="form-login" class="space-y-4 rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Correo electrónico</label>
        <input id="email" type="email" required autocomplete="username"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
      <p id="login-error" class="hidden text-sm text-red-600"></p>
      <button id="btn-submit" type="submit"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60">
        Entrar
      </button>
    </form>
    <p class="mt-4 text-center text-xs text-gray-400">
      ¿No tienes cuenta? Pídele al administrador que te cree un usuario desde el panel de Supabase.
    </p>
  </div>
</div>

<script src="assets/js/layout.js"></script>
<script>
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btn-submit");
    const errorEl = document.getElementById("login-error");
    errorEl.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const { error } = await window.sb.auth.signInWithPassword({ email, password });

    if (error) {
      console.error("Error de inicio de sesión:", error);

      let mensaje = "Correo o contraseña incorrectos.";
      if (/email not confirmed/i.test(error.message)) {
        mensaje =
          'Este usuario no está confirmado. En Supabase, ve a Authentication → Users, ábrelo y marca "Confirm email" (o bórralo y créalo de nuevo marcando "Auto Confirm User").';
      } else if (/failed to fetch|networkerror/i.test(error.message)) {
        mensaje =
          "No se pudo conectar con Supabase. Revisa que copiaste bien la URL y la llave en assets/js/config.js.";
      } else if (error.message) {
        mensaje = "Error de Supabase: " + error.message;
      }

      errorEl.textContent = mensaje;
      errorEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
