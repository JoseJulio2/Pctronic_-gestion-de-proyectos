<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Principal · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="dashboard" data-title="Panel Principal" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4" id="kpi-cards">
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white">
      <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
        <h2 class="font-bold text-gray-900">Proyectos recientes</h2>
        <a href="proyectos.html" class="text-sm font-semibold text-primary hover:underline">Ver todos →</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-5 py-3">Proyecto</th>
              <th class="px-5 py-3">Estado</th>
              <th class="px-5 py-3">Avance</th>
              <th class="px-5 py-3">Valor Total</th>
            </tr>
          </thead>
          <tbody id="tabla-proyectos-recientes">
            <tr><td class="px-5 py-6 text-gray-400" colspan="4">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white">
      <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
        <h2 class="font-bold text-gray-900">Facturas pendientes</h2>
        <a href="facturacion.html" class="text-sm font-semibold text-primary hover:underline">Ver todas →</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-5 py-3">Proyecto</th>
              <th class="px-5 py-3">N° Factura</th>
              <th class="px-5 py-3">Vencimiento</th>
              <th class="px-5 py-3">Valor</th>
            </tr>
          </thead>
          <tbody id="tabla-facturas-pendientes">
            <tr><td class="px-5 py-6 text-gray-400" colspan="4">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
