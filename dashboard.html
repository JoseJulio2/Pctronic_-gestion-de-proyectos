<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Principal · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="dashboard" data-title="Panel Principal" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-6">
    <div class="flex flex-wrap items-center justify-end gap-2">
      <button id="btn-personalizar" class="flex items-center gap-1 rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50">
        <span class="material-symbols-outlined text-[16px]">tune</span> Personalizar tarjetas
      </button>
      <button id="btn-modo-comite" class="flex items-center gap-1 rounded-lg bg-gray-900 px-3 py-2 text-xs font-semibold text-white hover:bg-gray-700">
        <span class="material-symbols-outlined text-[16px]">present_to_all</span> Modo Comité de Gerencia
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4" id="kpi-cards">
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
      <div class="h-24 rounded-xl border border-gray-200 bg-white p-4 skeleton"></div>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white" id="seccion-proyectos-recientes">
      <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
        <h2 class="font-bold text-gray-900">Proyectos recientes</h2>
        <a href="proyectos.html" class="text-sm font-semibold text-primary hover:underline">Ver todos →</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-5 py-3">Proyecto</th>
              <th class="px-5 py-3">Estado</th>
              <th class="px-5 py-3">Avance</th>
              <th class="px-5 py-3">Valor Total</th>
            </tr>
          </thead>
          <tbody id="tabla-proyectos-recientes">
            <tr><td class="px-5 py-6 text-gray-400" colspan="4">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white" id="seccion-facturas-pendientes">
      <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
        <h2 class="font-bold text-gray-900">Facturas pendientes</h2>
        <a href="facturacion.html" class="text-sm font-semibold text-primary hover:underline">Ver todas →</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-5 py-3">Proyecto</th>
              <th class="px-5 py-3">N° Factura</th>
              <th class="px-5 py-3">Vencimiento</th>
              <th class="px-5 py-3">Valor</th>
            </tr>
          </thead>
          <tbody id="tabla-facturas-pendientes">
            <tr><td class="px-5 py-6 text-gray-400" colspan="4">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal: personalizar tarjetas del panel -->
<div id="modal-personalizar" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-5 shadow-xl">
    <h3 class="mb-4 text-base font-bold text-gray-900">Personalizar Panel</h3>
    <div id="lista-personalizar" class="space-y-2 text-sm"></div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="btn-cerrar-personalizar" class="rounded-lg bg-primary px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">Listo</button>
    </div>
  </div>
</div>

<!-- Modo Comité de Gerencia: presentación de pantalla completa -->
<div id="modo-comite" class="fixed inset-0 z-50 hidden flex-col bg-white">
  <div class="flex items-center justify-between border-b border-gray-200 px-8 py-3">
    <p class="text-sm font-semibold text-gray-500">Modo Comité de Gerencia</p>
    <button id="btn-cerrar-comite" class="rounded-lg border border-gray-300 px-3 py-1.5 text-xs font-semibold text-gray-700 hover:bg-gray-50">
      <span class="material-symbols-outlined align-middle text-[16px]">close</span> Cerrar (Esc)
    </button>
  </div>
  <div id="comite-contenido" class="flex-1 overflow-y-auto px-10 py-8"></div>
  <div class="flex items-center justify-between border-t border-gray-200 px-8 py-3">
    <button id="btn-comite-anterior" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">← Anterior</button>
    <p class="text-xs text-gray-400" id="comite-indicador"></p>
    <button id="btn-comite-siguiente" class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Siguiente →</button>
  </div>
</div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
