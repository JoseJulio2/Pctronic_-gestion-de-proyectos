<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contratistas · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/excel.js"></script>
</head>
<body data-page="contratistas" data-title="Contratistas" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <input id="filtro-busqueda" type="search" placeholder="Buscar contratistas..."
        class="w-72 rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary" />
      <button id="btn-exportar" class="flex items-center gap-2 rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50"><span class="material-symbols-outlined text-[18px]">download</span> Exportar Excel</button>
      <button id="btn-nuevo" class="flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
        <span class="material-symbols-outlined text-[18px]">add</span> Nuevo Contratista
      </button>
    </div>

    <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3">Nombre</th>
            <th class="px-4 py-3">Tipo</th>
            <th class="px-4 py-3">Retención</th>
            <th class="px-4 py-3">Especialidad</th>
            <th class="px-4 py-3">Teléfono</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="tabla-catalogo">
          <tr><td class="px-4 py-6 text-gray-400" colspan="6">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="modal-catalogo" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
    <h3 id="modal-titulo" class="mb-4 text-base font-bold text-gray-900">Nuevo registro</h3>
    <div id="modal-campos" class="space-y-3"></div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="modal-cancelar" class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Cancelar</button>
      <button id="modal-guardar" class="rounded-lg bg-primary px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
    </div>
  </div>
</div>

<script src="assets/js/layout.js"></script>
<script>
  window.CATALOGO_CONFIG = {
    tabla: "contratistas",
    titulo: "Contratistas",
    campos: [
      { key: "nombre", label: "Nombre / Cuadrilla", tipo: "text", requerido: true },
      {
        key: "tipo_persona",
        label: "Tipo",
        tipo: "select",
        requerido: true,
        opciones: [
          { value: "empresa", label: "Empresa" },
          { value: "persona_natural", label: "Persona Natural" },
        ],
      },
      {
        key: "es_declarante_renta",
        label: "¿Declarante de renta?",
        tipo: "boolean",
        showIf: { key: "tipo_persona", value: "persona_natural" },
        enTabla: false,
      },
      { key: "porcentaje_retencion", label: "Retención", tipo: "porcentaje", calculado: true },
      { key: "identificacion", label: "Identificación / NIT", tipo: "text", enTabla: false },
      { key: "especialidad", label: "Especialidad", tipo: "text" },
      { key: "telefono", label: "Teléfono", tipo: "tel" },
      { key: "email", label: "Correo", tipo: "email", enTabla: false },
    ],
  };
</script>
<script src="assets/js/catalogo.js"></script>
</body>
</html>
