<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cliente · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="clientes" data-title="Detalle de Cliente" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-6">
    <div class="flex items-center gap-2 text-sm text-gray-500">
      <a href="clientes.html" class="hover:text-primary flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> Clientes
      </a>
      <span>/</span>
      <span id="detalle-nombre" class="font-medium text-gray-800">—</span>
    </div>

    <section class="rounded-xl border border-gray-200 bg-white p-5">
      <h2 class="mb-4 text-base font-bold text-gray-900">Datos del cliente</h2>
      <div class="grid gap-4 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">Nombre / Razón social *</label>
          <input id="campo-padre-nombre" type="text"
            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">NIT</label>
          <input id="campo-padre-nit" type="text"
            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">Notas</label>
          <input id="campo-padre-notas" type="text"
            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
        </div>
      </div>
      <div class="mt-4 flex justify-end">
        <button id="btn-guardar-padre" class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Guardar cambios</button>
      </div>
    </section>

    <section class="rounded-xl border border-gray-200 bg-white p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-base font-bold text-gray-900">Contactos</h2>
        <button id="btn-nuevo-contacto" class="flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
          <span class="material-symbols-outlined text-[18px]">add</span> Nuevo Contacto
        </button>
      </div>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-4 py-3">Nombre</th>
              <th class="px-4 py-3">Cargo</th>
              <th class="px-4 py-3">Tipo</th>
              <th class="px-4 py-3">Teléfono</th>
              <th class="px-4 py-3">Correo</th>
              <th class="px-4 py-3"></th>
            </tr>
          </thead>
          <tbody id="tabla-contactos">
            <tr><td class="px-4 py-6 text-gray-400" colspan="6">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="modal-contacto" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
    <h3 id="modal-contacto-titulo" class="mb-4 text-base font-bold text-gray-900">Nuevo contacto</h3>
    <div class="space-y-3">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Nombre *</label>
        <input id="campo-contacto-nombre" type="text"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Cargo</label>
        <input id="campo-contacto-cargo" type="text"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Tipo de contacto</label>
        <select id="campo-contacto-tipo"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm"></select>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Teléfono</label>
        <input id="campo-contacto-telefono" type="tel"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Correo</label>
        <input id="campo-contacto-email" type="email"
          class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm" />
      </div>
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="modal-contacto-cancelar" class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Cancelar</button>
      <button id="modal-contacto-guardar" class="rounded-lg bg-primary px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
    </div>
  </div>
</div>

<script src="assets/js/layout.js"></script>
<script>
  window.DETALLE_CONFIG = {
    tablaPadre: "clientes",
    tablaHija: "clientes_contactos",
    fk: "cliente_id",
    titulo: "Cliente",
    volverHref: "clientes.html",
    tiposContacto: [
      { value: "contabilidad", label: "Contabilidad" },
      { value: "compras", label: "Compras" },
      { value: "proyectos", label: "Proyectos" },
      { value: "otro", label: "Otro" },
    ],
  };
</script>
<script src="assets/js/detalle-contactos.js"></script>
</body>
</html>
